[workspace]
members = [
    "crates/legacy-ddd",
    "crates/dd-migrate",
    "crates/next-domain",
    "crates/legacy-migrate",
    "crates/ddnx",
    "crates/editor-geometry",
    "crates/editor-core",
    "crates/editor-runtime",
    "crates/render-plan",
    "crates/render-svg",
]
exclude = [
    "crates/app-core",
    "crates/platform-fs",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
zip = { version = "=7.0.0", default-features = false }
