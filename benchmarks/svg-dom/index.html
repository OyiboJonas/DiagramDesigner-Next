<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiagramDesigner Next — SVG DOM benchmark</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
    header, footer { padding: 12px 16px; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid currentColor; }
    button, select { font: inherit; padding: 6px 10px; }
    #stage { min-height: 0; overflow: hidden; background: Canvas; }
    svg { display: block; width: 100%; height: 100%; }
    #status { margin-left: auto; font-variant-numeric: tabular-nums; }
    pre { margin: 0; max-height: 28vh; overflow: auto; padding: 12px 16px; border-top: 1px solid currentColor; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>SVG DOM 4K benchmark</strong>
    <label>nodes
      <select id="count">
        <option value="5000">5,000</option>
        <option value="20000">20,000</option>
      </select>
    </label>
    <label>mode
      <select id="mode">
        <option value="culled">viewport-culling</option>
        <option value="full">full DOM</option>
      </select>
    </label>
    <button id="run">Run</button>
    <button id="runAll">Run all 4 cases</button>
    <span id="status">idle</span>
  </header>
  <main id="stage" aria-label="benchmark stage">
    <svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="none">
      <g id="scene"></g>
    </svg>
  </main>
  <pre id="output" aria-live="polite"></pre>
  <script src="benchmark.js" type="module"></script>
</body>
</html>
