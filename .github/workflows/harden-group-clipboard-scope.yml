name: Harden group clipboard scope

on:
  push:
    branches: [desktop-group-clipboard]
    paths:
      - '.github/workflows/harden-group-clipboard-scope.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply explicit scene-scope validation
        run: python .github/scripts/harden-group-clipboard-scope.py
      - name: Format
        run: cargo fmt --all
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Diff check
        run: git diff --check
      - name: Commit product fix and remove temporary helpers
        run: |
          git rm .github/scripts/harden-group-clipboard-scope.py .github/workflows/harden-group-clipboard-scope.yml
          git add apps/desktop/src-tauri/src/clipboard.rs
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Editor: enforce clipboard scene boundaries'
          git push
