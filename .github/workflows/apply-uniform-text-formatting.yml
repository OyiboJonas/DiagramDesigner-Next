name: Apply uniform text formatting slice

on:
  push:
    branches:
      - editor-uniform-text-formatting
    paths:
      - .github/workflows/apply-uniform-text-formatting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: editor-uniform-text-formatting
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Apply guarded source integration
        run: python scripts/apply_uniform_text_formatting.py

      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Check desktop JavaScript syntax
        run: node --check apps/desktop/ui/app.js

      - name: Run text formatting contract regressions
        run: node --test web/editor-interaction/text-formatting-actions.test.mjs

      - name: Remove one-shot integration helpers
        run: |
          rm scripts/apply_uniform_text_formatting.py
          rm .github/workflows/apply-uniform-text-formatting.yml

      - name: Commit integrated slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Editor: add uniform text formatting"
          git push origin HEAD:editor-uniform-text-formatting
