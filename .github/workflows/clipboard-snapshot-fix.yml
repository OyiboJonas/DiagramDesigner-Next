name: Apply clipboard snapshot fix

on:
  push:
    branches:
      - desktop-copy-paste-duplicate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-copy-paste-duplicate
          fetch-depth: 0
      - name: Apply clipboard snapshot semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/desktop/src-tauri/src/lib.rs')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target:\n{old[:160]}')
              s = s.replace(old, new, 1)

          replace_once(
              '''struct DesktopClipboard {
                  payload: clipboard::ClipboardPayload,
                  paste_count: u32,
              }''',
              '''#[derive(Debug, Clone)]
              struct ClipboardAppearanceSnapshot {
                  stroke: Option<StrokeStyle>,
                  fill: Option<FillStyle>,
                  text_color: Option<Color>,
              }

              struct DesktopClipboard {
                  payload: clipboard::ClipboardPayload,
                  appearance: std::collections::BTreeMap<ElementId, ClipboardAppearanceSnapshot>,
                  paste_count: u32,
              }''',
          )

          replace_once(
              '''    let count = payload.len();
                  let mut application_clipboard = state.clipboard.lock().map_err(|_| {''',
              '''    let count = payload.len();
                  let appearance = capture_clipboard_appearance(
                      document.session.session().document(),
                      &selected,
                  )?;
                  let mut application_clipboard = state.clipboard.lock().map_err(|_| {''',
          )

          replace_once(
              '''    *application_clipboard = Some(DesktopClipboard {
                  payload,
                  paste_count: 0,
              });''',
              '''    *application_clipboard = Some(DesktopClipboard {
                  payload,
                  appearance,
                  paste_count: 0,
              });''',
          )

          replace_once(
              '''    let appearance_updates = prepare_clipboard_appearance_updates(
                  document.session.session().document(),
                  &mut instantiated,
              )?;''',
              '''    let appearance_updates =
                  prepare_clipboard_appearance_updates(&clipboard.appearance, &mut instantiated)?;''',
          )

          replace_once(
              '''    let payload = clipboard::capture_selection(document.session.session().document(), &selected)
                  .map_err(|error| CommandError::new("duplicate_failed", error.to_string()))?;
              let mut instantiated = payload.instantiate(1);''',
              '''    let payload = clipboard::capture_selection(document.session.session().document(), &selected)
                  .map_err(|error| CommandError::new("duplicate_failed", error.to_string()))?;
              let appearance = capture_clipboard_appearance(
                  document.session.session().document(),
                  &selected,
              )?;
              let mut instantiated = payload.instantiate(1);''',
          )

          replace_once(
              '''    let appearance_updates = prepare_clipboard_appearance_updates(
                  document.session.session().document(),
                  &mut instantiated,
              )?;''',
              '''    let appearance_updates =
                  prepare_clipboard_appearance_updates(&appearance, &mut instantiated)?;''',
          )

          pattern = re.compile(
              r'''fn prepare_clipboard_appearance_updates\(\n    document: &Document,\n    instantiated: &mut clipboard::ClipboardInstantiation,\n\) -> Result<Vec<ElementAppearanceUpdate>, CommandError> \{.*?\n\}\n\n(?=#\[tauri::command\]\nfn update_element_properties)''',
              re.S,
          )
          replacement = '''fn capture_clipboard_appearance(
                  document: &Document,
                  selected: &[ElementId],
              ) -> Result<
                  std::collections::BTreeMap<ElementId, ClipboardAppearanceSnapshot>,
                  CommandError,
              > {
                  const APPEARANCE_STYLE_NAMESPACE: &str = "diagramdesigner-next:element-appearance";
                  let mut snapshots = std::collections::BTreeMap::new();

                  for source_id in selected {
                      let source = find_element(document, *source_id).ok_or_else(|| {
                          CommandError::new(
                              "clipboard_source_missing",
                              "A copied source element no longer exists in the current document.",
                          )
                      })?;
                      let dedicated_style_id = StyleId::v5(source_id.0, APPEARANCE_STYLE_NAMESPACE);
                      if source.style_id != Some(dedicated_style_id) {
                          continue;
                      }
                      let style = document
                          .styles
                          .iter()
                          .find(|style| style.id == dedicated_style_id)
                          .ok_or_else(|| {
                              CommandError::new(
                                  "clipboard_appearance_missing",
                                  "The copied element's dedicated appearance style is missing.",
                              )
                          })?;
                      snapshots.insert(
                          *source_id,
                          ClipboardAppearanceSnapshot {
                              stroke: style.stroke.clone(),
                              fill: style.fill.clone(),
                              text_color: style.text_color,
                          },
                      );
                  }

                  Ok(snapshots)
              }

              fn prepare_clipboard_appearance_updates(
                  snapshots: &std::collections::BTreeMap<ElementId, ClipboardAppearanceSnapshot>,
                  instantiated: &mut clipboard::ClipboardInstantiation,
              ) -> Result<Vec<ElementAppearanceUpdate>, CommandError> {
                  let mut updates = Vec::new();

                  for (source_id, copied_id) in &instantiated.source_element_ids {
                      let Some(style) = snapshots.get(source_id) else {
                          continue;
                      };
                      let copied = instantiated
                          .elements
                          .iter_mut()
                          .find(|element| element.id == *copied_id)
                          .ok_or_else(|| {
                              CommandError::new(
                                  "clipboard_copy_missing",
                                  "The instantiated clipboard element could not be resolved.",
                              )
                          })?;

                      copied.style_id = None;
                      updates.push(ElementAppearanceUpdate {
                          element_id: *copied_id,
                          stroke: style.stroke.clone(),
                          fill: style.fill.clone(),
                          text_color: style.text_color,
                      });
                  }

                  Ok(updates)
              }

              '''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'prepare helper replacement count: {count}')

          path.write_text(s, encoding='utf-8')
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify diff
        run: git diff --check
      - name: Commit snapshot fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs
          git commit -m "Fix: freeze clipboard appearance at copy time"
          git push origin HEAD:desktop-copy-paste-duplicate
