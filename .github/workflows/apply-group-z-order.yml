name: Apply group-aware z-order patch

on:
  push:
    branches: [desktop-group-z-order]
    paths:
      - '.github/workflows/apply-group-z-order.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-z-order
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply product patch
        run: python3 scripts/apply-group-z-order.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Editor core tests
        run: cargo test --locked -p editor-core
      - name: Application core z-order tests
        run: cargo test --manifest-path crates/app-core/Cargo.toml --test z_order_application
      - name: Desktop JavaScript syntax
        run: node --check apps/desktop/ui/app.js
      - name: Z-order frontend tests
        run: node --test web/editor-interaction/z-order-actions.test.mjs
      - name: Clippy touched Rust crates
        run: |
          cargo clippy --locked -p editor-core --all-targets -- -D warnings
          cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Diff check
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/editor-core/src/lib.rs \
            crates/app-core/tests/z_order_application.rs \
            apps/desktop/ui/app.js \
            web/editor-interaction/z-order-actions.test.mjs
          git commit -m "Editor: allow z-order for structural groups"
          git push origin HEAD:desktop-group-z-order
