name: Branch fidelity sync helper

on:
  push:
    branches: [phase-2/polygon-rendering]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/polygon-rendering
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Update deterministic fidelity scene
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/render-svg/examples/fidelity_scene.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Arrow marker + polygon are intentionally diagnostic/deferred": "Arrow marker and polygon are rendered by the Phase-2 production facade",
              '"Unsupported polygon sentinel"': '"Rendered polygon sentinel"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected fidelity text not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit synchronized fidelity scene
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/render-svg/examples/fidelity_scene.rs
          git commit -m "Phase 2: promote polygon in deterministic fidelity scene"
          git push origin HEAD:phase-2/polygon-rendering
