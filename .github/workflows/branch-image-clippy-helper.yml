name: Branch image Clippy fix helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'phase-2/image-assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/image-assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Make Base64 precedence explicit
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/render-svg/src/image.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '((b0 & 0x03) << 4) | b1.unwrap_or(0) >> 4': '((b0 & 0x03) << 4) | (b1.unwrap_or(0) >> 4)',
              '((b1 & 0x0f) << 2) | b2.unwrap_or(0) >> 6': '((b1 & 0x0f) << 2) | (b2.unwrap_or(0) >> 6)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected expression not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify formatting and Clippy
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p render-svg
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/branch-image-clippy-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 2: make raster Base64 encoding Clippy-clean"
          git push origin HEAD:phase-2/image-assets
