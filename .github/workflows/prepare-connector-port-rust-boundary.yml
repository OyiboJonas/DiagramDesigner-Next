name: Prepare connector port Rust boundary

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'desktop-connector-port-editing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-connector-port-editing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt,clippy
      - name: Apply connector port Rust boundary
        run: python scripts/prepare-connector-port-rust-boundary.py
      - name: Remove ambiguous endpoint test tie
        shell: bash
        run: sed -i 's/xPx: 52, yPx: 50/xPx: 51, yPx: 50/g' web/editor-interaction/connector-endpoint-gesture.test.mjs
      - name: Format editor and application core
        run: |
          cargo fmt --manifest-path crates/editor-core/Cargo.toml
          cargo fmt --manifest-path crates/app-core/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test editor core
        run: cargo test --locked --manifest-path crates/editor-core/Cargo.toml
      - name: Test application core
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Clippy application core
        run: cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Test endpoint gesture
        run: node --test web/editor-interaction/connector-endpoint-gesture.test.mjs
      - name: Verify patch
        run: git diff --check
      - name: Commit prepared Rust boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f crates/app-core/Cargo.lock
          rm scripts/prepare-connector-port-rust-boundary.py
          rm .github/workflows/prepare-connector-port-rust-boundary.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: expose connector ports and endpoint command"
          git push origin HEAD:desktop-connector-port-editing
