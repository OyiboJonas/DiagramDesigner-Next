name: Apply group-aware clipboard implementation

on:
  push:
    branches: [desktop-group-clipboard]
    paths:
      - '.github/workflows/apply-group-clipboard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply migration-safe product patch
        run: |
          python .github/scripts/group-clipboard-core-v2.py
          python .github/scripts/group-clipboard-model-v2.py
          python .github/scripts/group-clipboard-app-v2.py
      - name: Format Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/app-core/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Application core tests
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Application core Clippy
        run: cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Desktop JavaScript syntax
        run: node --check apps/desktop/ui/app.js
      - name: Frontend interaction tests
        run: node --test web/editor-interaction/*.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit migration-safe product implementation
        run: |
          git add \
            crates/editor-core/src/lib.rs \
            apps/desktop/src-tauri/src/clipboard.rs \
            apps/desktop/src-tauri/src/lib.rs \
            crates/app-core/src/lib.rs \
            crates/app-core/tests/group_clipboard_transaction.rs
          git diff --cached --quiet && { echo 'No migration-safe product changes staged'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Editor: preserve imported group snapshots in clipboard'
          git push

  windows-tauri:
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-clipboard
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Tauri desktop library tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
