name: Polygon branch integration helper

on:
  push:
    branches: [phase-2/polygon-rendering]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/polygon-rendering
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Integrate polygon facade and format
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/render-svg/src/public.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'mod orthogonal;\n',
              'mod orthogonal;\nmod polygon;\n',
              1,
          )
          text = text.replace(
              '    let mut output = core::render_plan_to_svg(document, page_id, plan, options)?;\n    orthogonal::apply_orthogonal_connectors(document, plan, &mut output);',
              '    let mut output = core::render_plan_to_svg(document, page_id, plan, options)?;\n    polygon::apply_polygons(document, plan, &mut output);\n    orthogonal::apply_orthogonal_connectors(document, plan, &mut output);',
              1,
          )
          path.write_text(text, encoding="utf-8")
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit integration when needed
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/polygon-branch-helper.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 2: integrate polygon rendering into public SVG facade"
          git push origin HEAD:phase-2/polygon-rendering
