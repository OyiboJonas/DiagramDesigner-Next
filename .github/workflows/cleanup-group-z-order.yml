name: Clean group-aware z-order helpers

on:
  push:
    branches: [desktop-group-z-order]
    paths:
      - '.github/workflows/cleanup-group-z-order.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-z-order
      - name: Remove temporary patch infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-group-z-order.yml
          rm -f scripts/apply-group-z-order.py
          rm -f .github/workflows/cleanup-group-z-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build: remove group-aware z-order helpers"
          git push origin HEAD:desktop-group-z-order
