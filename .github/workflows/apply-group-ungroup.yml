name: Apply grouping product patch

on:
  push:
    branches: [desktop-group-ungroup]
    paths:
      - '.github/workflows/apply-group-ungroup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-ungroup
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply product patch
        run: python3 scripts/apply-group-ungroup.py
      - name: Resolve logical group IDs on keyboard focus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/ui/candidate-svg-keyboard.mjs')
          text = path.read_text(encoding='utf-8')
          old = """      const elementId = event.target?.getAttribute?.('data-element-id');
              if (elementId && currentElements.some((entry) => entry.id === elementId)) {
                controller.activate(elementId);
"""
          new = """      const rawElementId = event.target?.getAttribute?.('data-element-id');
              const elementId = rawElementId ? resolveElementId(rawElementId) : null;
              if (elementId && currentElements.some((entry) => entry.id === elementId)) {
                controller.activate(elementId);
"""
          if text.count(old) != 1:
              raise SystemExit(f'keyboard focus marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/app-core/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Application core tests
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Desktop JavaScript syntax
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/candidate-svg-surface.mjs
          node --check apps/desktop/ui/candidate-svg-keyboard.mjs
      - name: Grouping frontend tests
        run: node --test web/editor-interaction/group-actions.test.mjs web/editor-interaction/selection-groups.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/app-core/src/lib.rs \
            crates/app-core/tests/grouping_application.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/grouping.rs \
            apps/desktop/ui/app.js \
            apps/desktop/ui/index.html \
            apps/desktop/ui/candidate-svg-surface.mjs \
            apps/desktop/ui/candidate-svg-keyboard.mjs \
            apps/desktop/ui/editor-interaction/group-actions.mjs \
            apps/desktop/ui/editor-interaction/selection-groups.mjs \
            web/editor-interaction/group-actions.mjs \
            web/editor-interaction/group-actions.test.mjs \
            web/editor-interaction/selection-groups.mjs \
            web/editor-interaction/selection-groups.test.mjs
          git commit -m "Editor: wire group and ungroup desktop flow"
          git push origin HEAD:desktop-group-ungroup
