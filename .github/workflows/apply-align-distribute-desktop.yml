name: Apply align distribute desktop

on:
  push:
    branches: [editor-align-distribute]
    paths:
      - scripts/apply-align-distribute-desktop.py
      - .github/workflows/apply-align-distribute-desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-align-distribute
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply desktop align distribute changes
        run: python scripts/apply-align-distribute-desktop.py
      - name: Format Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop command ACL parity
        run: python scripts/check-desktop-command-acl.py
      - name: Desktop JavaScript syntax
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/editor-interaction/arrange-actions.mjs
      - name: Arrange frontend tests
        run: node --test web/editor-interaction/arrange-actions.test.mjs
      - name: Full frontend interaction tests
        run: node --test web/editor-interaction/*.test.mjs
      - name: Editor workspace tests
        run: cargo test --locked --workspace
      - name: Application core tests
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Application core Clippy
        run: cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Diff check
        run: git diff --check
      - name: Commit product changes and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-align-distribute-desktop.yml scripts/apply-align-distribute-desktop.py
          git add \
            apps/desktop/src-tauri/build.rs \
            apps/desktop/src-tauri/capabilities/main-editor.json \
            apps/desktop/src-tauri/permissions/editor.toml \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/ui/app.js \
            apps/desktop/ui/index.html \
            apps/desktop/ui/editor-interaction/arrange-actions.mjs \
            web/editor-interaction/arrange-actions.mjs \
            web/editor-interaction/arrange-actions.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Desktop: expose align and distribute controls"
          git push origin HEAD:editor-align-distribute
