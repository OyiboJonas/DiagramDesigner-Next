name: Clean group page-scope helpers

on:
  push:
    branches: [desktop-group-ungroup]
    paths:
      - '.github/workflows/cleanup-group-page-scope.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-ungroup
      - name: Remove temporary page-scope patch infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-group-page-scope.yml
          rm -f scripts/fix-group-page-scope.py
          rm -f .github/workflows/cleanup-group-page-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build: remove group page-scope helpers"
          git push origin HEAD:desktop-group-ungroup
