name: Prepare connector endpoint application

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'editor-core-connector-endpoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-core-connector-endpoints
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt,clippy
      - name: Correct preparation anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/prepare-connector-endpoint-app.py")
          text = path.read_text(encoding="utf-8")
          old_name = "fn move_commit_marks_document_dirty_and_drives_recovery()"
          new_name = "fn prepared_save_is_verified_but_does_not_mark_dirty_state_clean_before_ack()"
          if old_name not in text:
              raise SystemExit("old app-core test function marker not found")
          text = text.replace(old_name, new_name, 1)
          old_defaults = r'''            defaults: defaults(),\n'''
          new_defaults = r'''            defaults: DocumentDefaults {\n                font_family: "Arial".to_owned(),\n                font_size_pt: 10.0,\n                font_style_bits: 0,\n                object_shadows: false,\n                auto_line_break: true,\n                connector_label_style: ConnectorLabelStyle::Transparent,\n            },\n'''
          if old_defaults not in text:
              raise SystemExit("defaults helper marker not found")
          text = text.replace(old_defaults, new_defaults, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply connector endpoint application slice
        run: python scripts/prepare-connector-endpoint-app.py
      - name: Format application core
        run: cargo fmt --manifest-path crates/app-core/Cargo.toml
      - name: Test editor core
        run: cargo test --locked --manifest-path crates/editor-core/Cargo.toml
      - name: Test application core
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Clippy application core
        run: cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Verify patch
        run: git diff --check
      - name: Commit prepared application boundary
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/prepare-connector-endpoint-app.py
          rm .github/workflows/prepare-connector-endpoint-app.yml
          rm -f crates/app-core/Cargo.lock
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "App core: expose connector endpoint semantics"
          git push origin HEAD:editor-core-connector-endpoints
