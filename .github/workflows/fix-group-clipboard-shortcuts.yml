name: Fix group clipboard shortcuts

on:
  push:
    branches: [fix-group-clipboard-shortcuts]
    paths:
      - '.github/workflows/fix-group-clipboard-shortcuts.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shortcut regression fix
        run: python .github/scripts/fix-group-clipboard-shortcuts.py
      - name: Desktop JavaScript syntax
        run: node --check apps/desktop/ui/app.js && node --check apps/desktop/ui/editor-interaction/clipboard-actions.mjs
      - name: Frontend interaction tests
        run: node --test web/editor-interaction/*.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit product fix and remove temporary helpers
        run: |
          git rm .github/scripts/fix-group-clipboard-shortcuts.py .github/workflows/fix-group-clipboard-shortcuts.yml
          git add apps/desktop/ui/app.js apps/desktop/ui/editor-interaction/clipboard-actions.mjs web/editor-interaction/clipboard-actions.mjs web/editor-interaction/clipboard-actions.test.mjs
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix: allow group clipboard keyboard shortcuts'
          git push
