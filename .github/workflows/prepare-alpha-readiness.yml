name: Prepare alpha 0.1 readiness

on:
  push:
    branches:
      - alpha-0.1-readiness-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-0.1-readiness-apply
          fetch-depth: 0
      - name: Apply prepared alpha patch
        run: python scripts/prepare-alpha-readiness.py
      - name: Format Rust changes
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Validate shortcut policy
        run: node --test web/editor-interaction/app-shortcuts.test.mjs
      - name: Validate frontend syntax
        run: node --check apps/desktop/ui/app.js
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit applied alpha readiness changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/windows-preview.yml apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/src/lib.rs apps/desktop/ui/index.html apps/desktop/ui/app.js
          git commit -m "Alpha: apply 0.1 readiness"
          git push origin HEAD:alpha-0.1-readiness-apply
