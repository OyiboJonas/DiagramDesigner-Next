name: Prepare basic shape ports

on:
  push:
    branches: [desktop-connector-port-editing]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-connector-port-editing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply default shape ports
        run: python scripts/prepare-basic-shape-ports.py
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify default shape port source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('apps/desktop/src-tauri/src/lib.rs').read_text(encoding='utf-8')
          if text.count('ports: default_shape_ports(),') != 1:
              raise SystemExit('basic element must use default_shape_ports exactly once')
          if 'ports: Vec::new(),' not in text:
              raise SystemExit('connector creation must continue to use no element ports')
          for marker in [
              '(0_u16, 0.5, 0.0)',
              '(1_u16, 1.0, 0.5)',
              '(2_u16, 0.5, 1.0)',
              '(3_u16, 0.0, 0.5)',
              'id: PortId::new()',
              'position: NormalizedPoint { x, y }',
          ]:
              if marker not in text:
                  raise SystemExit(f'missing default port contract marker: {marker}')
          PY
      - name: Verify patch
        run: git diff --check
      - name: Commit prepared shape ports
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/prepare-basic-shape-ports.py
          rm .github/workflows/prepare-basic-shape-ports.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: add default connector ports to basic shapes"
          git push origin HEAD:desktop-connector-port-editing
