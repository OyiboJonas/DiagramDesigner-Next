name: Fix connector UI state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'desktop-connector-drawing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-connector-drawing
          fetch-depth: 0
      - name: Apply connector UI state fixes
        run: python scripts/fix-connector-ui-state.py
      - name: Verify connector interaction tests
        run: node --test web/editor-interaction/connector-gesture.test.mjs
      - name: Verify desktop JavaScript
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/candidate-svg-surface.mjs
      - name: Verify patch
        run: git diff --check
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix-connector-ui-state.py
          rm .github/workflows/fix-connector-ui-state.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: keep connector tool state coherent"
          git push origin HEAD:desktop-connector-drawing
