name: Apply z-order application and desktop slice

on:
  push:
    branches:
      - desktop-z-order-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-z-order-controls
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply application and desktop z-order slice
        run: python -c "import base64; exec(base64.b64decode('''))"
      - name: Format Rust
        run: |
          cargo fmt --manifest-path crates/app-core/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test application core
        run: cargo test --locked --manifest-path crates/app-core/Cargo.toml
      - name: Clippy application core
        run: cargo clippy --locked --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Check desktop Rust
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Check frontend
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/editor-interaction/z-order-actions.mjs
          node --test web/editor-interaction/z-order-actions.test.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/app-core/src/lib.rs apps/desktop/src-tauri/src/lib.rs apps/desktop/ui/app.js apps/desktop/ui/index.html apps/desktop/ui/editor-interaction/z-order-actions.mjs web/editor-interaction/z-order-actions.mjs web/editor-interaction/z-order-actions.test.mjs
          git commit -m "Desktop: add z-order arrange controls"
          git push origin HEAD:desktop-z-order-controls
