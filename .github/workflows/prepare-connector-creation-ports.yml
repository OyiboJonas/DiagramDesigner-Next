name: Prepare connector creation ports

on:
  push:
    branches: [desktop-connector-creation-ports]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-connector-creation-ports
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Adjust preparation for web facade
        run: python scripts/fix-connector-creation-prep.py
      - name: Apply connector creation port attachment
        run: python scripts/prepare-connector-creation-ports.py
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Check desktop interaction syntax
        run: |
          node --check apps/desktop/ui/editor-interaction/connector-gesture.mjs
          node --check apps/desktop/ui/candidate-svg-surface.mjs
          node --check apps/desktop/ui/app.js
          node --check web/editor-interaction/connector-gesture.mjs
      - name: Test connector interactions
        run: node --test web/editor-interaction/connector-gesture.test.mjs web/editor-interaction/connector-endpoint-gesture.test.mjs
      - name: Verify web connector gesture facade
        run: grep -Fq "../../apps/desktop/ui/editor-interaction/connector-gesture.mjs" web/editor-interaction/connector-gesture.mjs
      - name: Verify patch
        run: git diff --check
      - name: Commit prepared product changes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix-connector-creation-prep.py
          rm scripts/prepare-connector-creation-ports.py
          rm .github/workflows/prepare-connector-creation-ports.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: attach connectors to ports during creation"
          git push origin HEAD:desktop-connector-creation-ports
