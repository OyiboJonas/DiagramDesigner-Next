name: Clean first desktop editor commands

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'desktop-first-editor-commands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-first-editor-commands
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply cleanup
        run: python scripts/cleanup-first-editor-commands.py
      - name: Format application core
        run: cargo fmt --manifest-path crates/app-core/Cargo.toml
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify application core
        run: cargo test --manifest-path crates/app-core/Cargo.toml
      - name: Verify desktop JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Verify patch
        run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f crates/app-core/Cargo.lock
          rm scripts/cleanup-first-editor-commands.py
          rm .github/workflows/cleanup-first-editor-commands.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: clean first constructive editor slice"
          git push origin HEAD:desktop-first-editor-commands
