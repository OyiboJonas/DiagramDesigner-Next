name: Prepare connector endpoint core

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'editor-core-connector-endpoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-core-connector-endpoints
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt,clippy
      - name: Apply connector endpoint core slice
        run: python scripts/prepare-connector-endpoint-core.py
      - name: Format editor core
        run: cargo fmt --manifest-path crates/editor-core/Cargo.toml
      - name: Test editor core
        run: cargo test --locked --manifest-path crates/editor-core/Cargo.toml
      - name: Clippy editor core
        run: cargo clippy --locked --manifest-path crates/editor-core/Cargo.toml --all-targets -- -D warnings
      - name: Verify patch
        run: git diff --check
      - name: Commit prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/prepare-connector-endpoint-core.py
          rm .github/workflows/prepare-connector-endpoint-core.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Editor core: add connector endpoint port semantics"
          git push origin HEAD:editor-core-connector-endpoints
