name: Apply desktop command ACL contract

on:
  push:
    branches: [desktop-command-acl-contract]
    paths:
      - '.github/workflows/apply-desktop-command-acl-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply ACL contract changes
        run: python .github/scripts/apply-desktop-command-acl-contract.py
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Validate ACL parity
        run: python scripts/check-desktop-command-acl.py
      - name: Validate Tauri ACL configuration and compile
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Diff check
        run: git diff --check
      - name: Commit product changes and remove temporary helpers
        run: |
          git rm .github/scripts/apply-desktop-command-acl-contract.py .github/workflows/apply-desktop-command-acl-contract.yml
          git add .github/workflows/rust.yml scripts/check-desktop-command-acl.py apps/desktop/src-tauri/build.rs apps/desktop/src-tauri/permissions/editor.toml apps/desktop/src-tauri/capabilities/main-editor.json
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Security: enforce desktop command ACL parity'
          git push
