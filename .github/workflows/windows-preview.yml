name: Windows desktop preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'desktop-windows-preview-build' || github.head_ref == 'desktop-preview-main-trigger' || github.head_ref == 'alpha-0.1-readiness-apply'
    runs-on: windows-latest
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout source ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build release executable
        shell: powershell
        run: |
          cargo build --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            throw "Windows alpha release build failed."
          }
      - name: Resolve alpha version
        shell: powershell
        run: |
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          if (-not $version) {
            throw "Desktop version is missing from tauri.conf.json"
          }
          "DDN_DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble alpha artifact
        shell: powershell
        run: |
          $source = "apps/desktop/src-tauri/target/release/diagram-designer-next-desktop.exe"
          if (-not (Test-Path $source -PathType Leaf)) {
            throw "Alpha executable was not produced at $source"
          }
          $size = (Get-Item $source).Length
          if ($size -le 0) {
            throw "Alpha executable is empty."
          }
          New-Item -ItemType Directory -Force -Path dist/windows-preview | Out-Null
          Copy-Item $source "dist/windows-preview/DiagramDesigner-Next-Alpha.exe"
          Copy-Item "docs/testing/alpha-0.1.md" "dist/windows-preview/TESTING.md"
          $commit = (git rev-parse HEAD).Trim()
          $lockBlob = (git rev-parse HEAD:apps/desktop/src-tauri/Cargo.lock).Trim()
          @(
            "DiagramDesigner Next Windows Alpha",
            "version=$env:DDN_DESKTOP_VERSION",
            "channel=alpha",
            "source_commit=$commit",
            "desktop_cargo_lock_blob=$lockBlob",
            "executable_bytes=$size",
            "rust_toolchain=1.85.0",
            "signed=false",
            "installer=false"
          ) | Set-Content -Encoding UTF8 "dist/windows-preview/BUILD.txt"
      - name: Upload Windows alpha
        uses: actions/upload-artifact@v4
        with:
          name: DiagramDesigner-Next-Windows-Alpha-${{ env.DDN_DESKTOP_VERSION }}
          path: dist/windows-preview
          if-no-files-found: error
          retention-days: 14
