name: Fix selection inspector state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'desktop-first-editor-commands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-first-editor-commands
          fetch-depth: 0
      - name: Apply UI state fix
        run: python scripts/fix-selection-inspector-state.py
      - name: Verify JavaScript
        run: node --check apps/desktop/ui/app.js
      - name: Verify patch
        run: git diff --check
      - name: Commit UI state fix
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix-selection-inspector-state.py
          rm .github/workflows/fix-selection-inspector-state.yml
          git config user.name "DiagramDesigner Next automation"
          git config user.email "190651966+OyiboJonas@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Desktop: keep selection actions in sync"
          git push origin HEAD:desktop-first-editor-commands
