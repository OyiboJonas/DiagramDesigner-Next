name: Fix group page scope

on:
  push:
    branches: [desktop-group-ungroup]
    paths:
      - '.github/workflows/fix-group-page-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-group-ungroup
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply page-scope fix
        run: python3 scripts/fix-group-page-scope.py
      - name: Format and verify
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          git diff --check
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/grouping.rs apps/desktop/src-tauri/src/lib.rs
          git commit -m "Fix: scope grouping presentation to active page"
          git push origin HEAD:desktop-group-ungroup
