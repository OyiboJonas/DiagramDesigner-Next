name: Apply connector style core

on:
  push:
    branches: [editor-connector-style]
    paths:
      - scripts/apply-connector-style-core.py
      - .github/workflows/apply-connector-style-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-connector-style
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply typed connector style changes
        run: python scripts/apply-connector-style-core.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/app-core/Cargo.toml
      - name: Editor core tests
        run: cargo test --locked -p editor-core
      - name: Application core connector style tests
        run: cargo test --manifest-path crates/app-core/Cargo.toml --test connector_style_application
      - name: Application core Clippy
        run: cargo clippy --manifest-path crates/app-core/Cargo.toml --all-targets -- -D warnings
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Diff check
        run: git diff --check
      - name: Commit product changes and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-connector-style-core.yml scripts/apply-connector-style-core.py
          git add crates/editor-core/src/lib.rs crates/app-core/src/lib.rs crates/app-core/tests/connector_style_application.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Editor: add typed connector style command"
          git push origin HEAD:editor-connector-style
