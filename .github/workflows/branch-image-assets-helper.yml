# Temporary self-removing helper for the Phase-2 image-assets branch.
name: Branch image-assets integration helper

on:
  push:
    branches: [phase-2/image-assets]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'phase-2/image-assets' || github.ref == 'refs/heads/phase-2/image-assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/image-assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Wire raster image support into production facade
        run: python scripts/phase-2-integrate-image-assets.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Test raster image renderer
        run: cargo test --locked -p render-svg
      - name: Check deterministic fidelity example
        run: cargo check --locked -p render-svg --example fidelity_scene
      - name: Commit integrated image support
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/branch-image-assets-helper.yml
          rm scripts/phase-2-integrate-image-assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 2: integrate raster image asset rendering"
          git push origin HEAD:phase-2/image-assets
